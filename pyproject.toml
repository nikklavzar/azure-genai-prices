[project]
name = "azure-genai-prices"
version = "0.1.0"
description = "Azure AI Foundry / Azure OpenAI pricing, including Data Zone deployments."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Nik Klavžar", email = "nikklavzar@gmail.com" }]
keywords = ["azure", "openai", "pricing", "llm", "cost", "data-zone", "genai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
redis = ["redis>=5.0"]

[project.urls]
Homepage = "https://github.com/nikklavzar/azure-genai-prices"
Issues = "https://github.com/nikklavzar/azure-genai-prices/issues"
Changelog = "https://github.com/nikklavzar/azure-genai-prices/blob/main/CHANGELOG.md"

[project.scripts]
azure-genai-prices = "azure_genai_prices.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azure_genai_prices"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
